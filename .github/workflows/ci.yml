name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.12
        run: uv python install '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ty
        run: uv run ty check

  # The generated files must match what their scripts write. The 2.x map reads
  # the v2.8.2 tag, so this job clones the full history and the tags.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.12
        run: uv python install '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check the indicator ids
        run: uv run python scripts/generate_ids.py --check

      - name: Check the 2.x map
        run: uv run python scripts/generate_v2_map.py --check

      - name: Check the indicator reference
        run: uv run python scripts/generate_indicator_docs.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group test

      # Data tests read multi-GB OECD tables, so they run on a warm cache locally.
      - name: Run tests
        run: uv run pytest -m 'not data' --cov='src/oda_data' --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: matrix.python-version == '3.13'
        with:
          files: ./coverage.xml

  # Lightweight cross-platform smoke check. The full matrix above runs on Linux;
  # this confirms the runtime behaves on macOS and Windows (paths, filelock,
  # platformdirs, parquet caching) without the cost of a full OS × version grid.
  # Single Python version, fast test suite only (integration/network deselected).
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest -m 'not data'
