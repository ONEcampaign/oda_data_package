site_name: tools/oda-data
site_description: Named ODA indicators from the OECD DAC tables, in any currency, with a record of where each number came from

validation:
  anchors: warn

theme:
  name: material

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.blocks.admonition:
      types:
        - note
        - warning
        - info
  - pymdownx.blocks.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - How-to guides:
      - Constant prices and currencies: how-to/units.md
      - Groups and totals: how-to/groups-and-totals.md
      - Sectors and policy markers: how-to/sectors-and-markers.md
      - Imputed multilateral sectors: how-to/imputed-multilateral.md
      - Records and extra columns: how-to/records.md
      - Provenance and pinned releases: how-to/provenance.md
      - Offline use and caching: how-to/offline-and-caching.md
  - Reference:
      - Indicators: reference/indicators.md
      - Public API: reference/api.md
      - Errors and warnings: reference/errors.md
  - Explanation:
      - Counting rules: explanation/counting-rules.md
      - How imputed multilateral sectors work: explanation/imputation-method.md
      - Versions and releases: explanation/versioning.md
      - Glossary: explanation/glossary.md
  - Migrating from 2.x: migration.md
  - Contributing: contributing.md
  - Changelog: changelog.md
