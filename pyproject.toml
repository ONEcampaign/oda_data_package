[project]
name = "oda_data"
version = "3.0.0"
description = "A python package to work with Official Development Assistance data from the OECD DAC."
requires-python = ">=3.12"

license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    {name = "Jorge Rivera", email = "jorge.rivera@one.org"},
    {name = "Miguel Haro Ruiz", email = "miguel.haroruiz@one.org"}
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "duckdb>=1.1.0",
    "oda-reader>=1.15.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydeflate>=2.7.0",
    "readerkit>=0.1.0",
    "resolvekit>=0.1.13",
]

[project.optional-dependencies]
polars = ["polars>=1.0.0"]

[project.urls]
Homepage = "https://github.com/ONEcampaign/oda_data_package"
Repository = "https://github.com/ONEcampaign/oda_data_package"
Documentation = "https://github.com/ONEcampaign/oda_data_package/blob/main/docs/docs/index.md"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.14.9",
    "ty>=0.0.33",
    "mkdocs-material>=9.7.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "polars>=1.0.0",
    # The tutorial's chart example, which tests/docs runs.
    "matplotlib>=3.8.0",
]
# Maintenance-only tooling for scripts/refresh_channel_crosswalk.py.
maintenance = [
    "pyyaml>=6.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-include = ["*.ipynb"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PL",    # pylint
    "RUF",   # ruff-specific rules
    "ERA",   # eradicate (commented-out code)
    "PERF",  # perflint
    "ANN",   # flake8-annotations (require type hints on public APIs)
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import outside top-level (the package defers heavy imports)
    "ANN401",  # Allow `Any` in typed signatures
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "E501", "PLR2004"]
# The module-level __getattr__ loads names lazily and caches them in globals().
"src/oda_data/__init__.py" = ["PLW0603", "PLW0602", "F811"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/oda_data", "tests/unit/typing_checks.py"]

# pandas and numpy stubs are incomplete; treating them as Any avoids a cascade
# of false positives without disabling checks on this package's own code.
[tool.ty.analysis]
replace-imports-with-any = [
    "pandas",
    "pandas.**",
    "numpy",
    "numpy.**",
]

[tool.ty.rules]
possibly-missing-attribute = "ignore"
possibly-unresolved-reference = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "data: reads the real OECD tables through the oda-reader cache (needs a warm cache; ODA_DATA_REQUIRE_DATA=1 turns a skip into a failure)",
]
norecursedirs = [".git", ".venv", "venv", "__pycache__", "*.egg-info", ".pytest_cache", "htmlcov"]

[tool.coverage.run]
source = ["src/oda_data"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.codespell]
# NotIn is a filter class in _model.py; Programm is a deliberate typo that
# tests/unit/test_resolve.py feeds the resolver.
ignore-words-list = "NotIn,Programm"
